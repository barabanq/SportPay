services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sport_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - sport_network

  webserver:
    image: nginx:alpine
    container_name: sport_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sport_network

  db:
    image: mysql:8.0
    container_name: sport_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sport_exchange
      MYSQL_USER: sport_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "33088:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sport_network

networks:
  sport_network:
    driver: bridge

volumes:
  db_data:
    driver: local
