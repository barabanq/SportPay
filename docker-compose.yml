services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportpay-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sportpay}
      DB_USERNAME: ${DB_USERNAME:-sportpay}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sportpay-net

  nginx:
    image: nginx:1.27-alpine
    container_name: sportpay-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - reverb
    networks:
      - sportpay-net

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportpay-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8080}:8080"
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - sportpay-net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportpay-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - sportpay-net

  db:
    image: postgres:16-alpine
    container_name: sportpay-db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sportpay}
      POSTGRES_USER: ${DB_USERNAME:-sportpay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - sportpay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sportpay} -d ${DB_DATABASE:-sportpay}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sportpay-net

  redis:
    image: redis:7-alpine
    container_name: sportpay-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - sportpay-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sportpay-net

networks:
  sportpay-net:
    driver: bridge

volumes:
  sportpay-pgdata:
  sportpay-redis:
